[package]
name = "surgeist-text"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bj-data-eng/surgeist-text"
readme = "README.md"
description = "Parley-backed text layout boundary for Surgeist surfaces."

[lib]
name = "surgeist_text"
path = "src/lib.rs"

[dependencies]
accesskit = { version = "=0.24.0", optional = true }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash", "shape-run-cache"] }
fontdb = { version = "=0.23.0", default-features = false, features = ["std", "memmap"] }
parley = "=0.9.0"
surgeist-render = { path = "../surgeist-render", version = "=0.1.0", optional = true }

[features]
default = []
text-accessibility = ["dep:accesskit", "parley/accesskit"]
text-render = ["dep:surgeist-render"]

[dev-dependencies]
pollster = "=0.4.0"
